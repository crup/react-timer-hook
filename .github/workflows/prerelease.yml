name: Prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - rc
      version_base:
        description: Base version before prerelease suffix
        required: true
        default: 0.0.1

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref_name == 'next'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm typecheck
          pnpm test

      - name: Set prerelease version
        run: pnpm version "${{ inputs.version_base }}-${{ inputs.tag }}.${{ github.run_number }}" --no-git-tag-version

      - name: Build package
        run: |
          pnpm build
          pnpm size

      - name: Publish prerelease
        run: pnpm publish --tag "${{ inputs.tag }}" --access public --no-git-checks
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
